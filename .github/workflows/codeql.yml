# CodeQL over the Go modules, the JavaScript and TypeScript, and these workflows.
#
# ci.yml already runs gosec against a reviewed baseline and govulncheck. CodeQL asks
# what those cannot: where a value from a request reaches a sink -- a file path, a
# redirect, a query, a log line -- across functions and packages, which a scanner
# reading one function at a time does not follow. It also reads the workflows, where
# an expression interpolated into a `run:` line is an injection. Free for a public
# repository. Findings go to the repository's code scanning alerts and do not fail
# the job, so they are read and triaged there, like gosec's baseline, not trusted as
# a pass.
name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            operator/go.sum
            terraform-provider-signari/go.sum
            sdk/go/go.sum
            tools/bench/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Each module built under CodeQL's tracer, since there is no module at the root
      # for its autobuilder to find.
      - if: matrix.language == 'go'
        name: Build every Go module
        run: |
          for m in engine operator terraform-provider-signari sdk/go tools/bench; do
            (cd "$m" && go build ./...)
          done
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

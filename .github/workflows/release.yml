# Signs a release and records its provenance, after rebuilding it here and finding it
# byte-identical to what was published (3.29).
#
# scripts/build-release.sh builds a release twice and refuses unless the two builds are
# identical, so anyone with the same toolchain can rebuild one from its tag. This does
# exactly that, with the same script and Go version, and compares the binary and SBOM it
# makes with the ones attached to the release: the binary byte for byte, the SBOM in
# everything but the hashes the SBOM tool records of its own executable, which differ
# with wherever it was installed (v0.1.0's has them; the script now leaves them out).
# Only if both match does it sign them,
# keylessly with cosign under this workflow's GitHub identity, and attest SLSA build
# provenance for the binary's digest. Signatures and provenance go to Sigstore's public
# transparency log, and the signature bundles are attached to the release.
#
# A release published from now on is signed as it is published; an earlier one, such as
# v0.1.0, by starting this by hand with its tag. The tag reaches the shell only through
# the TAG variable, never interpolated into a command.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to rebuild, compare and sign, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fingerprint
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false

      - name: Install the release tools at the versions the script names
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The script names the release after the tag the tree is at, as the original build did.
      - name: Rebuild the release
        env:
          SIGNARI_FINGERPRINT_DSN: postgres://postgres@localhost:5432/fingerprint
        run: |
          test "$(git describe --tags --exact-match)" = "$TAG"
          mkdir -p "$RUNNER_TEMP/rebuilt"
          scripts/build-release.sh "$RUNNER_TEMP/rebuilt/signari-$TAG-linux-amd64"

      - name: Compare with what was published
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/published" \
            -p "signari-$TAG-linux-amd64" -p "signari-$TAG-linux-amd64.cdx.json"
          cd "$RUNNER_TEMP"
          bin="signari-$TAG-linux-amd64"
          rebuilt=$(sha256sum "rebuilt/$bin" | cut -d' ' -f1)
          published=$(sha256sum "published/$bin" | cut -d' ' -f1)
          echo "$bin: rebuilt $rebuilt, published $published"
          [ "$rebuilt" = "$published" ] || { echo "::error::$bin rebuilt here is not what was published"; exit 1; }
          described() { jq -cS 'del(.metadata.tools[].hashes)' "$1" | sha256sum | cut -d' ' -f1; }
          rebuilt=$(described "rebuilt/$bin.cdx.json")
          published=$(described "published/$bin.cdx.json")
          echo "$bin.cdx.json without the tool's own hashes: rebuilt $rebuilt, published $published"
          [ "$rebuilt" = "$published" ] || { echo "::error::the SBOM rebuilt here does not describe what the published one does"; exit 1; }

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the binary and the SBOM
        run: |
          cd "$RUNNER_TEMP/published"
          for f in "signari-$TAG-linux-amd64" "signari-$TAG-linux-amd64.cdx.json"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/published/signari-${{ env.TAG }}-linux-amd64

      - name: Attach the signatures to the release
        run: |
          cd "$RUNNER_TEMP/published"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            "signari-$TAG-linux-amd64.sigstore.json" "signari-$TAG-linux-amd64.cdx.json.sigstore.json"

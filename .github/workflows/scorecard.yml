# OpenSSF Scorecard: the repository's own security practice, checked the way a
# prospective user's tooling checks it -- branch protection, pinned dependencies,
# token permissions in these workflows, signed releases, a security policy, fuzzing,
# dependency updates. Free. The results go to the repository's code scanning alerts
# and are kept as an artifact. They are not published to the OpenSSF API or badge
# (publish_results: false): that is a public statement about the project, the
# owner's to make, and it is one line to change.
name: scorecard

on:
  push:
  schedule:
    - cron: "41 5 * * 1"
  branch_protection_rule:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard

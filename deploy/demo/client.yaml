# The demo applications' clients (6.21), applied by docker-compose.yml's `demo-client`
# to the organisation bootstrap made: the only one there is, so the file names none.
# Applied again, it plans nothing. Each is public, PKCE its only proof, so there is no
# secret to hand an application; each redirect URI is its application's own port.
version: 1
clients:
  - client_id: demo
    name: Demo application
    public: true
    redirect_uris: [http://localhost:8097/callback]
  - client_id: demo-express
    name: Express demo
    public: true
    redirect_uris: [http://localhost:8091/callback]
  - client_id: demo-nextjs
    name: Next.js demo
    public: true
    redirect_uris: [http://localhost:8092/callback]
  - client_id: demo-django
    name: Django demo
    public: true
    # Django's URLs end in a slash, and a redirect URI is matched exactly.
    redirect_uris: [http://localhost:8093/callback/]
  - client_id: demo-spring
    name: Spring Boot demo
    public: true
    # Spring's own pattern, /login/oauth2/code/<registration>.
    redirect_uris: [http://localhost:8094/login/oauth2/code/signari]
  - client_id: demo-laravel
    name: Laravel demo
    public: true
    redirect_uris: [http://localhost:8095/callback]
    # The PHP library verifies RSA signatures only, and Signari signs with ES256 by default.
    id_token_signed_response_alg: RS256

# Development stack.
#
# It exists for two reasons: it is the deployment artifact, and it puts the engine
# on a Docker network the OIDF conformance suite can reach. The suite runs inside
# the container runtime, so an engine listening on the macOS host at
# `localhost:8099` is unreachable from it -- and since relying parties compare the
# issuer byte-for-byte, the issuer has to be the name the suite will actually use.
# That is why SIGNARI_ISSUER below is a service name, not localhost.

name: signari

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: signari_superuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: signari
      # The console's role, made with this password on first start; see postgres-init/.
      SIGNARI_ADMIN_DB_PASSWORD: ${SIGNARI_ADMIN_DB_PASSWORD:-devconsole}
    healthcheck:
      # The engine must not start against a database that is still initialising:
      # its startup gate would report a schema mismatch and exit, which looks like
      # a migration bug rather than a race.
      test: ["CMD-SHELL", "pg_isready -U signari_superuser -d signari"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  # Migrations run as a separate one-shot service rather than on engine startup.
  # An engine replica that migrates on boot means N replicas racing to migrate,
  # and it makes rollback ambiguous: which version is the schema at when half the
  # fleet is old?
  migrate:
    build:
      context: ../engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SIGNARI_DSN: postgres://signari_superuser:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/signari?sslmode=disable
    # `migrate all` rather than a shell chaining two commands: the runtime image
    # is distroless and has no /bin/sh, and adding a shell to a security product
    # to save a CLI verb is a bad trade.
    command: ["migrate", "all"]
    restart: "no"

  # A first run, on request, so that the conformance flows sharing this file are not
  # given one. The log carries a one-time link for the first person:
  #
  #   SIGNARI_ROOT_KEY=... SIGNARI_FIRST_EMAIL=you@example.com \
  #     docker compose --profile first-run up bootstrap
  bootstrap:
    profiles: ["first-run"]
    build:
      context: ../engine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SIGNARI_DSN: postgres://signari_superuser:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/signari?sslmode=disable
      SIGNARI_ROOT_KEY: ${SIGNARI_ROOT_KEY:?set SIGNARI_ROOT_KEY -- head -c 32 /dev/urandom | base64}
      SIGNARI_ROOT_KEY_REF: ${SIGNARI_ROOT_KEY_REF:-dev}
    # No `:?` on the email: compose checks those on every command that reads this file,
    # profile or not, and `bootstrap` says what is missing for itself.
    command: ["bootstrap", "-issuer", "${SIGNARI_ISSUER:-https://localhost:8099}", "-email", "${SIGNARI_FIRST_EMAIL:-}"]
    restart: "no"

  engine:
    build:
      context: ../engine
      args:
        # Flip to "certified" to build against the CMVP-validated FIPS module.
        GOFIPS140: "off"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SIGNARI_DSN: postgres://signari_superuser:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/signari?sslmode=disable
      # 32 random bytes, base64. Deliberately has no default: a generated-on-boot
      # root key would make every restart invalidate every stored signing key.
      SIGNARI_ROOT_KEY: ${SIGNARI_ROOT_KEY:?set SIGNARI_ROOT_KEY -- head -c 32 /dev/urandom | base64}
      SIGNARI_ROOT_KEY_REF: ${SIGNARI_ROOT_KEY_REF:-dev}
      # Local conformance testing only -- see the comment on Config.AllowInsecureIssuer.
      SIGNARI_INSECURE_ISSUER: ${SIGNARI_INSECURE_ISSUER:-0}
      # When set, the engine serves HTTPS. Required for anything real: browsers
      # refuse to store the __Host- session cookie over plaintext on a non-localhost
      # host, so sign-in silently fails to persist without it.
      SIGNARI_TLS_CERT: ${SIGNARI_TLS_CERT:-}
      SIGNARI_TLS_KEY: ${SIGNARI_TLS_KEY:-}
      # Empty, nothing changes. The conformance back-channel plan sets both, so a
      # logout token can reach the suite on this network under its own CA.
      SIGNARI_OUTBOUND_ALLOW_PRIVATE: ${SIGNARI_OUTBOUND_ALLOW_PRIVATE:-}
      SIGNARI_CA_BUNDLE: ${SIGNARI_CA_BUNDLE:-}
      # The Admin API the console writes through, on this network only: no port is
      # published for it. Off unless set, and plaintext only when asked for by name.
      SIGNARI_ADMIN_ADDR: ${SIGNARI_ADMIN_ADDR:-}
      SIGNARI_ADMIN_INSECURE: ${SIGNARI_ADMIN_INSECURE:-0}
    volumes:
      - ./tls:/tls:ro
    ports:
      - "8099:8080"
    networks:
      default:
        aliases:
          # The name the conformance suite resolves. The issuer must match this
          # exactly, or every relying party rejects our tokens on the iss check.
          - signari-engine

  # The console, on request, at http://localhost:8098/admin (3.25). Its own profile, so
  # the conformance flows sharing this file are not given one:
  #
  #   CONSOLE_APP_KEY=base64:$(head -c 32 /dev/urandom | base64) \
  #   SIGNARI_ADMIN_ADDR=:8081 SIGNARI_ADMIN_INSECURE=1 \
  #     docker compose --profile console up -d
  #
  # It reads as signari_admin through core_v1 and writes through the Admin API, and
  # needs an admin token (SIGNARI_ADMIN_TOKEN) and an operator; docs/deployment-artefacts.md
  # says how.
  console-migrate:
    profiles: ["console"]
    # The app stage by name: the last stage, which a build takes without one, is nginx.
    build:
      context: ../admin
      target: app
    image: signari-console
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: &console-env
      APP_KEY: ${CONSOLE_APP_KEY:-}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${CONSOLE_URL:-http://localhost:8098}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: signari
      DB_USERNAME: signari_admin
      DB_PASSWORD: ${SIGNARI_ADMIN_DB_PASSWORD:-devconsole}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      SIGNARI_ADMIN_URL: ${CONSOLE_ADMIN_URL:-http://signari-engine:8081}
      SIGNARI_ADMIN_TOKEN: ${SIGNARI_ADMIN_TOKEN:-}
    # The console's own tables, in the admin schema, as signari_admin.
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"

  console:
    profiles: ["console"]
    build:
      context: ../admin
      target: app
    image: signari-console
    depends_on:
      console-migrate:
        condition: service_completed_successfully
    environment: *console-env

  console-web:
    profiles: ["console"]
    build:
      context: ../admin
      target: web
    image: signari-console-web
    depends_on:
      - console
    ports:
      - "8098:8080"

volumes:
  pgdata:

networks:
  default:
    name: signari-net

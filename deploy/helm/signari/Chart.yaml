apiVersion: v2
name: signari
description: The Signari OIDC identity provider engine
type: application
# The chart is versioned independently of the engine. appVersion tracks the
# container image the chart deploys by default; bumping the image is a chart
# change, so this and values.image.tag move together.
version: 0.1.0
# Pinned, not "latest": a tag that moves deploys a different engine on every
# pull, so two pods of one release could run two versions. This is the image
# scripts/build-release.sh builds for the release of the same number.
appVersion: "0.1.0"
home: https://signari.dev
sources:
  - https://github.com/binary-ly/signari
keywords:
  - oidc
  - oauth2
  - identity-provider
  - sso

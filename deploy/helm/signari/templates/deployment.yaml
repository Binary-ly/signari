{{- include "signari.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signari.fullname" . }}
  labels:
    {{- include "signari.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "signari.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "signari.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the secret changes, so a rotated root key or DSN is
        # picked up without a manual restart.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ include "signari.gracePeriod" . }}
      containers:
        - name: engine
          image: {{ include "signari.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.adminApi.enabled }}
            - name: admin
              containerPort: {{ .Values.adminApi.port }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            - name: SIGNARI_ISSUER
              value: {{ .Values.issuer | quote }}
            - name: SIGNARI_SHUTDOWN_DRAIN
              value: {{ printf "%ds" (int .Values.shutdown.drainSeconds) | quote }}
            - name: SIGNARI_SHUTDOWN_TIMEOUT
              value: {{ printf "%ds" (int .Values.shutdown.timeoutSeconds) | quote }}
            {{- if .Values.adminApi.enabled }}
            - name: SIGNARI_ADMIN_ADDR
              value: {{ printf ":%d" (int .Values.adminApi.port) | quote }}
            {{- if .Values.adminApi.insecure }}
            - name: SIGNARI_ADMIN_INSECURE
              value: "1"
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: SIGNARI_METRICS_ADDR
              value: {{ printf ":%d" (int .Values.metrics.port) | quote }}
            {{- end }}
            {{- if .Values.tls.certSecretName }}
            - name: SIGNARI_TLS_CERT
              value: /tls/tls.crt
            - name: SIGNARI_TLS_KEY
              value: /tls/tls.key
            {{- end }}
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "signari.secretName" . }}
          {{- if .Values.tls.certSecretName }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          {{- end }}
          # /healthz is liveness only -- it describes the process, never the
          # deployment. Readiness gates traffic until the engine can serve, on
          # /readyz, which checks the database and the signing keys. Both probes
          # asked /healthz, so a pod whose database was unreachable kept taking
          # traffic.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.certSecretName }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if .Values.tls.certSecretName }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.tls.certSecretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.certSecretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

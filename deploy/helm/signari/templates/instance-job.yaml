{{- include "signari.validate" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "signari.fullname" . }}-instance
  labels:
    {{- include "signari.labels" . | nindent 4 }}
  annotations:
    # After the migration (-5) and before the engine pods. `serve` refuses to start
    # until an instance names the issuer it serves, and nothing in an install made
    # one, so a fresh install migrated and then never became ready. `instance
    # create` is idempotent: an issuer that has an instance keeps it and its keys,
    # so every upgrade runs it too.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "signari.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: instance
          image: {{ include "signari.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # As the engine connects, with its Secret: the root key seals the
          # instance's first signing keys.
          args: ["instance", "create", "-issuer", {{ .Values.issuer | quote }}]
          envFrom:
            - secretRef:
                name: {{ include "signari.secretName" . }}

{{- include "signari.validate" . -}}
{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "signari.fullname" . }}-secrets
  labels:
    {{- include "signari.labels" . | nindent 4 }}
  # A hook, created before the migration Job (weight -10 against its -5).
  # As an ordinary resource it was created after every pre-install hook, so
  # the Job on a fresh install started with no Secret to read and failed.
  # Not deleted after the hook: the engine pods read it too. Hook resources
  # outlive `helm uninstall`; delete it by hand, or use secret.existingSecret.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  SIGNARI_DSN: {{ .Values.secret.dsn | quote }}
  SIGNARI_ROOT_KEY: {{ .Values.secret.rootKey | quote }}
  SIGNARI_ROOT_KEY_REF: {{ .Values.secret.rootKeyRef | quote }}
  {{- if .Values.secret.adminToken }}
  SIGNARI_ADMIN_TOKEN: {{ .Values.secret.adminToken | quote }}
  {{- end }}
{{- end }}

<svg xmlns="http://www.w3.org/2000/svg" width="1304" height="594" viewBox="0 0 1304 594" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13"><rect width="1304" height="594" fill="#ffffff"/><text x="16" y="32" font-size="17" font-weight="600" fill="#111">Access policy</text><text x="16" y="55" fill="#444">Default: <tspan font-weight="600" fill="#991b1b">deny</tspan>  ·  5 rule(s)  ·  7 test(s), all passing</text><text x="16" y="74" fill="#777" font-size="11">Every rule that matches applies, together. A rule can only restrict, never grant.</text><rect x="16" y="90" width="1272" height="106" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="32" y="115" font-weight="600" fill="#111">Applies to every application</text><text x="32" y="131" fill="#999" font-size="11">no client named</text><text x="32" y="150" font-weight="600" fill="#1d4ed8">staff-can-sign-in</text><text x="40" y="172" fill="#333" font-size="12">• in any group: staff, contractors</text><rect x="16" y="220" width="300" height="194" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="32" y="245" font-weight="600" fill="#111">admin-console</text><text x="32" y="261" fill="#999" font-size="11">client</text><text x="32" y="280" font-weight="600" fill="#1d4ed8">admin-console-from-the-office</text><text x="40" y="302" fill="#333" font-size="12">• in all groups: platform</text><text x="40" y="324" fill="#333" font-size="12">• multi-factor authentication</text><text x="40" y="346" fill="#333" font-size="12">• from 10.0.0.0/8, 192.168.10.0/24</text><text x="40" y="368" fill="#333" font-size="12">• no impossible travel</text><text x="40" y="390" fill="#333" font-size="12">• a managed and compliant device</text><rect x="340" y="220" width="300" height="128" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="356" y="245" font-weight="600" fill="#111">finance</text><text x="356" y="261" fill="#999" font-size="11">client</text><text x="356" y="280" font-weight="600" fill="#1d4ed8">finance-needs-a-security-key</text><text x="364" y="302" fill="#333" font-size="12">• in all groups: finance</text><text x="364" y="324" fill="#333" font-size="12">• a passkey or security key</text><rect x="664" y="220" width="300" height="106" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="680" y="245" font-weight="600" fill="#111">payroll</text><text x="680" y="261" fill="#999" font-size="11">client</text><text x="680" y="280" font-weight="600" fill="#991b1b">contractors-cannot-reach-payroll</text><text x="688" y="302" fill="#991b1b" font-size="12">✕ denied outright</text><rect x="988" y="220" width="300" height="106" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="1004" y="245" font-weight="600" fill="#111">payroll-reports</text><text x="1004" y="261" fill="#999" font-size="11">client</text><text x="1004" y="280" font-weight="600" fill="#991b1b">contractors-cannot-reach-payroll</text><text x="1012" y="302" fill="#991b1b" font-size="12">✕ denied outright</text><rect x="16" y="438" width="300" height="106" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="32" y="463" font-weight="600" fill="#111">wiki</text><text x="32" y="479" fill="#999" font-size="11">client</text><text x="32" y="498" font-weight="600" fill="#1d4ed8">wiki-needs-nothing-special</text><text x="40" y="520" fill="#333" font-size="12">• in any group: staff, contractors</text><text x="16" y="580" fill="#999" font-size="11">Generated from the policy file. The file is the source of truth; this is a view of it.</text></svg>
{{define "title"}}{{T "enrol.title"}}{{end}}
{{define "content"}}
<h1>{{T "enrol.title"}}</h1>
{{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
{{if .Secret}}
<p>{{T "enrol.scan"}}</p>
<div class="qr">{{.QR}}</div>
<details>
<summary>{{T "enrol.cannotscan"}}</summary>
<p>{{T "enrol.typekey"}}</p>
<code class="secret">{{.Secret}}</code>
<p class="hint">{{T "enrol.openlink" .}}</p>
</details>
{{end}}
<form method="POST" action="/account/mfa/totp">
<input type="hidden" name="{{.CSRFField}}" value="{{.CSRF}}">
<label for="c">{{T "enrol.entercode"}}</label>
<input id="c" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required>
<button type="submit">{{T "enrol.submit"}}</button>
</form>
{{end}}

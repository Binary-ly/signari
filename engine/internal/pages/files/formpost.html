{{define "title"}}Signing you in…{{end}}
{{define "style"}}<style>
/* Self-contained: a bridge gets no shared stylesheet, because a browser posts
   it inside a redirect and it is only ever seen when scripting is off. */
body{margin:0;padding:5rem 1rem;font:.9375rem/1.55 ui-sans-serif,system-ui,
-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;color:#18181b}
button{margin-top:1rem;padding:.625rem 1.25rem;font:inherit;font-weight:500;
color:#fff;background:#18181b;border:0;border-radius:7px;cursor:pointer}
@media (prefers-color-scheme:dark){
body{background:#09090b;color:#ededf0}
button{color:#18181b;background:#ededf0}}
</style>{{end}}
{{define "usebare"}}{{end}}
{{define "content"}}
<form method="POST" action="{{.Action}}">
{{range .Fields}}<input type="hidden" name="{{.Name}}" value="{{.Value}}">
{{end}}<noscript>
<p>Continue to finish signing in.</p>
<button type="submit">Continue</button>
</noscript>
</form>
<script nonce="{{.Nonce}}">document.forms[0].submit();</script>
{{end}}

{{define "title"}}{{T "reset.title"}}{{end}}
{{define "content"}}
<h1>{{T "reset.title"}}</h1>
{{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
{{if .Pending}}
<p>{{T "reset.pending" .}}</p>
<p class="hint">{{T "reset.pending.hint"}}</p>
{{end}}
{{if .Ready}}
<form method="POST" action="/recover/reset">
<input type="hidden" name="token" value="{{.Token}}">
<input type="hidden" name="{{.CSRFField}}" value="{{.CSRF}}">
<label for="p">{{T "common.newpassword"}}</label>
<input id="p" name="password" type="password" autocomplete="new-password" autofocus required minlength="8">
<button type="submit">{{T "reset.submit"}}</button>
</form>
{{end}}
{{end}}

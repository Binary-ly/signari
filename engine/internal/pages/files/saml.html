{{define "title"}}Signing in&hellip;{{end}}
{{define "style"}}<style>
/* Self-contained: see formpost.html. */
body{margin:0;padding:5rem 1rem;font:.9375rem/1.55 ui-sans-serif,system-ui,
-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;color:#18181b}
button{margin-top:1rem;padding:.625rem 1.25rem;font:inherit;font-weight:500;
color:#fff;background:#18181b;border:0;border-radius:7px;cursor:pointer}
@media (prefers-color-scheme:dark){
body{background:#09090b;color:#ededf0}
button{color:#18181b;background:#ededf0}}
</style>{{end}}
{{define "usebare"}}{{end}}
{{define "content"}}
<noscript><p>JavaScript is disabled. Continue to complete signing in.</p></noscript>
<form method="post" action="{{.ACS}}">
<input type="hidden" name="SAMLResponse" value="{{.Response}}">
{{if .RelayState}}<input type="hidden" name="RelayState" value="{{.RelayState}}">{{end}}
<noscript><button type="submit">Continue</button></noscript>
</form>
{{end}}

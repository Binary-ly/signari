{{define "title"}}{{T "umaclaims.title"}}{{end}}
{{define "style"}}<style>
:root{--page-w:30rem}
</style>{{end}}
{{define "content"}}<h1>{{T "umaclaims.heading" .}}</h1>
<p class="who">{{T "umaclaims.wants" .}}</p>
<ul>
{{range .Asks}}<li><strong>{{.Resource}}</strong> — {{.Scopes}}</li>{{end}}
</ul>
<p>{{T "umaclaims.note" .}}</p>
<form method="post" action="/uma2/claims">
 <input type="hidden" name="{{.CSRFField}}" value="{{.CSRF}}">
 <input type="hidden" name="handle" value="{{.Handle}}">
 <button type="submit">{{T "common.confirm"}}</button>
</form>
{{end}}

# Signari as this application's OpenID provider. issuer-uri is read at start: Spring takes
# the endpoints from its discovery document and refuses one naming another issuer.
spring.security.oauth2.client.provider.signari.issuer-uri=${SIGNARI_ISSUER}
spring.security.oauth2.client.registration.signari.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.signari.client-secret=${CLIENT_SECRET:}
spring.security.oauth2.client.registration.signari.client-authentication-method=${CLIENT_AUTH:client_secret_basic}
spring.security.oauth2.client.registration.signari.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.signari.scope=openid,email,profile
spring.security.oauth2.client.registration.signari.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

server.address=127.0.0.1
server.port=${PORT:8080}
